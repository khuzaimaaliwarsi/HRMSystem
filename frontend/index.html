<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Impermeable Zero-LocalStorage Shield: Runs before ANY script or module bundle evaluates -->
    <script>
      (function() {
        try {
          var ALLOWED_KEYS = ['hrms_theme', 'hrms_sidebar_collapsed', 'hrms_table_density'];
          
          // 1. Immediately wipe any existing business data or non-whitelisted keys from localStorage
          if (typeof window !== 'undefined' && window.localStorage) {
            var keysToRemove = [];
            for (var i = 0; i < window.localStorage.length; i++) {
              var k = window.localStorage.key(i);
              if (k && ALLOWED_KEYS.indexOf(k) === -1) {
                keysToRemove.push(k);
              }
            }
            for (var j = 0; j < keysToRemove.length; j++) {
              window.localStorage.removeItem(keysToRemove[j]);
            }
          }

          // 2. Patch Storage.prototype to permanently forbid business data writes in browser runtime
          if (typeof Storage !== 'undefined' && Storage.prototype) {
            var origSet = Storage.prototype.setItem;
            var origGet = Storage.prototype.getItem;
            Storage.prototype.setItem = function(key, val) {
              if (typeof key === 'string' && ALLOWED_KEYS.indexOf(key) === -1) {
                // Strictly drop write: zero business data in browser localStorage
                return;
              }
              return origSet.call(this, key, val);
            };
            Storage.prototype.getItem = function(key) {
              if (typeof key === 'string' && ALLOWED_KEYS.indexOf(key) === -1) {
                return null;
              }
              return origGet.call(this, key);
            };
          }
          window.__hrms_shield_active = true;
        } catch (e) {}
      })();
    </script>
